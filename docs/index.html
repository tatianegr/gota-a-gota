<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0;url=../">
  <title>Gota a Gota — novo endereço</title>
  <script>
    // O histórico é preservado: o armazenamento local pertence ao mesmo domínio.
    const target = '../' + window.location.search + window.location.hash;
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations()
        .then(regs => Promise.all(regs.filter(reg => new URL(reg.scope).pathname.endsWith('/docs/')).map(reg => reg.unregister())))
        .catch(() => {});
    }
    window.location.replace(target);
  </script>
</head>
<body>
<p>O Gota a Gota mudou de endereço. <a href="../">Abrir o aplicativo</a>.</p>
</body>
</html>
